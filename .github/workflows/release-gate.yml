name: SpecsDekh Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: specsdekh-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --fund=false

      - name: Runtime doctor
        run: npm run doctor:runtime

      - name: Secret scan
        run: npm run security:scan

      - name: Static route audit
        run: npm run audit:static

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_URL: https://specsdekh.com
