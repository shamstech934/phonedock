name: SpecsDekh Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: specsdekh-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install exact dependencies
        run: npm ci --include=dev --no-audit --fund=false

      - name: Runtime doctor
        run: npm run doctor:runtime

      - name: Secret scan
        run: npm run security:scan

      - name: Static route audit
        run: npm run audit:static

      - name: Lint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Regression tests
        run: npm test

      - name: Validate build environment
        shell: bash
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
        run: |
          if [ -z "${MONGODB_URI:-}" ] && [ -z "${MONGO_URL:-}" ]; then
            echo "::error::Missing GitHub Actions secret MONGODB_URI (or legacy MONGO_URL). Add it under Settings > Secrets and variables > Actions."
            exit 1
          fi
          if [ -z "${DB_NAME:-}" ]; then
            echo "::error::Missing GitHub Actions secret DB_NAME. Set it to phonedock."
            exit 1
          fi

      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_BASE_URL: https://specsdekh.com
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGO_URL: ${{ secrets.MONGO_URL }}
          DB_NAME: ${{ secrets.DB_NAME }}
